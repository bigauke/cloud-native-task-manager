name: CI/CD
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Start app + database
        run: docker compose up -d --build      # sobe app E banco de verdade
      - name: Wait for health check
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health; then
              echo "App is healthy"
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Run tests
        run: npm test                            # testes rodam contra o app REAL,
      - name: Stop app + database                # não contra mocks
        if: always()
        run: docker compose down
  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -t profdiegoluispires/task-manager:${{ github.sha }} .
          docker tag profdiegoluispires/task-manager:${{ github.sha }} profdiegoluispires/task-manager:latest
  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'    # só publica a partir da branch de aula
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
      - name: Push Docker image
        run: |
          docker push profdiegoluispires/task-manager:${{ github.sha }}
          docker push profdiegoluispires/task-manager:latest
 